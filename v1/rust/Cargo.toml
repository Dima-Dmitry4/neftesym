[package]
name = "oilcore"
version = "0.1.0"
edition = "2021"
description = "Вычислительное ядро симулятора (давление, потоки, перенос насыщенности) для WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"

# свежий rustc для wasm32 по умолчанию использует эти возможности (все поддерживаются современными браузерами);
# wasm-opt нужно их явно разрешить
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-multivalue"]
